<!DOCTYPE html>
<html>
<head>
<title>GPC Smart Parking</title>
<style>
body {
    font-family: Arial;
    text-align: center;
    background-color: #f2f2f2;
}
.header {
    font-size: 30px;
    font-weight: bold;
    margin-top: 20px;
}
.login-box, .dashboard {
    margin-top: 50px;
}
input {
    padding: 10px;
    margin: 10px;
}
button {
    padding: 10px 20px;
    cursor: pointer;
}
.refresh {
    position: absolute;
    right: 20px;
    top: 20px;
}
.slot {
    margin: 10px;
    font-size: 20px;
}
</style>
</head>
<body>

<div class="header">GPC SMART PARKING</div>

<div class="login-box" id="loginBox">
    <h2>LOGIN</h2>
    <input type="text" id="username" placeholder="Username"><br>
    <input type="password" id="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
</div>

<div class="dashboard" id="dashboard" style="display:none;">
    <button class="refresh" onclick="location.reload()">Refresh</button>
    <h2>Floor 1</h2>
    <div class="slot">Slot 1 - <span id="s1">Empty</span></div>
    <div class="slot">Slot 2 - <span id="s2">Empty</span></div>
    <div class="slot">Slot 3 - <span id="s3">Empty</span></div>
    <div class="slot">Slot 4 - <span id="s4">Empty</span></div>
    <div class="slot">Slot 5 - <span id="s5">Empty</span></div>
</div>

<script>
function login() {
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    let validUsers = ["0001", "0002", "0003"];

    if(validUsers.includes(user) && pass === "gpc@123") {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
    } else {
        alert("Wrong Username or Password");
    }
}
</script>

</body>
</html>
